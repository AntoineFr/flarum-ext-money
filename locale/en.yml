      post-deleted: Post deletion deduction
      post-hidden: Post hidden deduction
      post-liked: Post like reward
      post-restored: Post restore reward
      post-reward: Post reward
      post-unliked: Post unlike deduction
    user_controls:
      money_button: Edit money
    modal:
      title: "{username}'s money"
      current: "Current:"
